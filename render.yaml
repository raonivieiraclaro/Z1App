services:
  - type: web
    name: z1-prospect-ia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: Z1_ADMIN_USER
        sync: false
      - key: Z1_ADMIN_PASSWORD
        sync: false
